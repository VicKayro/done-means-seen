name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # uv installs any Python version on any runner (setup-python no longer ships 3.9 for the newest Ubuntu).
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Tests
        run: uv run --no-project --python ${{ matrix.python }} --with pytest python -m pytest -q tests/ andon/tests/
